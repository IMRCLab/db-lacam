db-pibt:
  default:
    delta_0: 0.9
    num_primitives_0: 300
    alpha: 0.5 
    filter_duplicates: True
    heuristic1: "reverse-search" 
    heuristic1_delta: 1.0
    heuristic1_num_primitives_0: 100 
    heuristic1_distance: 1.0 # est lookup
    goal_delta: 0.5
    cluster_range: 0.05 # increase gives decrease in the 'after-clustering' motions' number
    cluster_distance: 0.5 # 0.75, 1.0
    cluster_n: 1
