name: Build

# Triggers the workflow on all push or pull request events
on: [push]
# on:
#   push:
#     branches: [ "main" ]
#   pull_request:
#     branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install system dependencies
      run: sudo apt update  && sudo apt install libboost-all-dev libfcl-dev cmake libeigen3-dev libyaml-cpp-dev liblz4-dev libmsgpack-dev -y

    - name: install crocoddyl
      run: |
        sudo tee /etc/apt/sources.list.d/robotpkg.list << EOF
        deb [arch=amd64] http://robotpkg.openrobots.org/packages/debian/pub $(lsb_release -sc) robotpkg
        EOF

        curl http://robotpkg.openrobots.org/packages/debian/robotpkg.key | sudo apt-key add -
        sudo apt update
        sudo apt install robotpkg-py310-crocoddyl coinor-libipopt-dev -y
    # - name: Try installing from robotpkg, fallback to pip
    #   run: |
    #     set -e
    #     sudo apt-get update
    #     sudo apt-get install -y curl gnupg lsb-release || true
    
    #     curl -fsSL http://robotpkg.openrobots.org/packages/debian/robotpkg.key | gpg --dearmor | sudo tee /usr/share/keyrings/robotpkg-archive-keyring.gpg > /dev/null
    #     echo "deb [arch=amd64 signed-by=/usr/share/keyrings/robotpkg-archive-keyring.gpg] http://robotpkg.openrobots.org/wip/packages/debian/pub $(lsb_release -sc) robotpkg" | sudo tee /etc/apt/sources.list.d/robotpkg.list
    
    #     sudo apt-get update
    #     if ! sudo apt-get install -y robotpkg-py310-crocoddyl coinor-libipopt-dev; then
    #       echo "robotpkg failed, installing via pip..."
    #       python3 -m pip install --upgrade pip
    #       python3 -m pip install crocoddyl
    #     fi
        
    # - name: Install latest ompl
    #   run: |
    #     mkdir __local
    #     git clone https://github.com/ompl/ompl
    #     cd ompl 
    #     git checkout e2994e5
    #     mkdir build && cd build && cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/__local  && make install -j8
    - name: Install OMPL from source
      run: |
        git clone https://github.com/ompl/ompl.git
        cd ompl
        git checkout e2994e5
    
        mkdir -p build
        cd build
    
        cmake .. \
          -DCMAKE_INSTALL_PREFIX=$HOME/__local \
          -DCMAKE_BUILD_TYPE=Release \
          -DOMPL_BUILD_PYBIND11_BINDINGS=OFF \
          -DOMPL_BUILD_EXAMPLES=OFF \
          -DOMPL_BUILD_TESTS=OFF \
          -DOMPL_BUILD_CMAKE_CONFIG=ON
    
        make -j$(nproc)
        make install

    - name: Configure CMake

      run: |
        rm -rf ${{github.workspace}}/build
        cmake -B "${{github.workspace}}/build" \
              -DCMAKE_BUILD_TYPE="${{env.BUILD_TYPE}}" \
              -DCMAKE_PREFIX_PATH="$HOME/__local;/opt/openrobots"

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

